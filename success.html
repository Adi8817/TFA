<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Screen</title>
     <link rel="icon" type="image/png" href="assets/image/TFA_Logo_Rev.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: bounce 0.8s ease;
        }

        .success-icon::after {
            content: '✓';
            color: white;
            font-size: 50px;
            font-weight: bold;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        .success-title {
            color: #28a745;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .success-message {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .user-name {
            color: #333;
            font-weight: bold;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .emoji {
            font-size: 24px;
            margin: 0 5px;
        }

        @media (max-width: 480px) {
            .success-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .success-title {
                font-size: 28px;
            }
            
            .success-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon"></div>
        <h1 class="success-title">Success!</h1>
        <p class="success-message">
            <span class="emoji">🎉</span>
            Thank you <span class="user-name" id="userName">User</span>!
            <span class="emoji">😊</span>
            <br><br>
            Your form has been submitted successfully.
            <br>
            We will get back to you soon!
        </p>
        <a href="javascript:history.back()" class="back-btn">
            ← Go Back
        </a>
    </div>

    <script>
        // URL parameters se name get karna
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('name');
        
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }

        // Auto redirect after 5 seconds (optional)
        // setTimeout(() => {
        //     window.history.back();
        // }, 5000);
    </script>
</body>
</html>
